<!DOCTYPE html>
<html lang="bn" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialHub - Live Social Network</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        fbBlue: '#1877F2',
                        fbBg: '#F0F2F5',
                        fbDarkBg: '#18191A',
                        fbDarkCard: '#242526',
                        fbDarkHover: '#3A3B3C'
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #475569;
        }
    </style>
</head>
<body class="bg-fbBg dark:bg-fbDarkBg text-gray-900 dark:text-gray-100 min-h-screen font-sans transition-colors duration-200">

    <!-- ================= NAVBAR ================= -->
    <header class="sticky top-0 z-40 bg-white dark:bg-fbDarkCard shadow-sm px-4 py-2 flex items-center justify-between">
        <!-- Left: Logo & Search -->
        <div class="flex items-center space-x-3">
            <h1 class="text-fbBlue font-extrabold text-2xl tracking-wider cursor-pointer flex items-center gap-1">
                <i class="fa-brands fa-facebook text-3xl"></i> SocialHub
            </h1>
            <div class="relative hidden sm:block">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400"></i>
                <input type="text" id="searchInput" onkeyup="filterPosts()" placeholder="SocialHub এ খুঁজুন..." 
                       class="bg-gray-100 dark:bg-fbDarkHover pl-9 pr-4 py-2 rounded-full text-sm focus:outline-none w-48 focus:w-64 transition-all">
            </div>
        </div>

        <!-- Center: Navigation Icons -->
        <nav class="hidden md:flex items-center space-x-1 lg:space-x-4">
            <button class="text-fbBlue border-b-4 border-fbBlue py-2 px-6 text-xl">
                <i class="fa-solid fa-house"></i>
            </button>
            <button class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-fbDarkHover rounded-lg py-2 px-6 text-xl">
                <i class="fa-solid fa-user-group"></i>
            </button>
            <button class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-fbDarkHover rounded-lg py-2 px-6 text-xl">
                <i class="fa-solid fa-tv"></i>
            </button>
            <button class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-fbDarkHover rounded-lg py-2 px-6 text-xl">
                <i class="fa-solid fa-[#1877F2] fa-store"></i>
            </button>
        </nav>

        <!-- Right: Controls & Profile -->
        <div class="flex items-center space-x-2">
            <!-- Dark Mode Toggle -->
            <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-fbDarkHover flex items-center justify-center text-gray-700 dark:text-yellow-400 hover:opacity-90">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>
            <!-- Messenger Icon -->
            <button onclick="toggleChatWindow('রহিম আহমেদ')" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-fbDarkHover flex items-center justify-center text-gray-700 dark:text-gray-200 hover:opacity-90 relative">
                <i class="fa-brands fa-facebook-messenger"></i>
                <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5">3</span>
            </button>
            <!-- Notifications -->
            <button onclick="alert('আপনার কোনো নতুন নোটিফিকেশন নেই।')" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-fbDarkHover flex items-center justify-center text-gray-700 dark:text-gray-200 hover:opacity-90">
                <i class="fa-solid fa-bell"></i>
            </button>
            <!-- Profile Avatar Button -->
            <div onclick="openProfileModal()" class="flex items-center space-x-2 cursor-pointer p-1 rounded-full hover:bg-gray-100 dark:hover:bg-fbDarkHover">
                <img id="navUserAvatar" src="https://i.pravatar.cc/150?img=68" alt="User Avatar" class="w-9 h-9 rounded-full object-cover border border-fbBlue">
            </div>
        </div>
    </header>

    <!-- ================= MAIN CONTAINER ================= -->
    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-6 p-4">

        <!-- ================= LEFT SIDEBAR ================= -->
        <aside class="hidden md:block col-span-1 space-y-2">
            <div onclick="openProfileModal()" class="flex items-center space-x-3 p-2 rounded-xl hover:bg-gray-200 dark:hover:bg-fbDarkHover cursor-pointer">
                <img id="sidebarUserAvatar" src="https://i.pravatar.cc/150?img=68" class="w-10 h-10 rounded-full object-cover">
                <div>
                    <h2 id="sidebarUserName" class="font-bold text-sm">সাকিব হাসান</h2>
                    <p class="text-xs text-gray-500 dark:text-gray-400">প্রোফাইল দেখুন</p>
                </div>
            </div>
            <div class="flex items-center space-x-3 p-3 rounded-xl hover:bg-gray-200 dark:hover:bg-fbDarkHover cursor-pointer text-fbBlue">
                <i class="fa-solid fa-user-group text-xl w-6"></i>
                <span class="font-medium text-gray-800 dark:text-gray-200 text-sm">বন্ধুরা (Friends)</span>
            </div>
            <div class="flex items-center space-x-3 p-3 rounded-xl hover:bg-gray-200 dark:hover:bg-fbDarkHover cursor-pointer text-purple-600">
                <i class="fa-solid fa-bookmark text-xl w-6"></i>
                <span class="font-medium text-gray-800 dark:text-gray-200 text-sm">সংরক্ষিত (Saved)</span>
            </div>
            <div class="flex items-center space-x-3 p-3 rounded-xl hover:bg-gray-200 dark:hover:bg-fbDarkHover cursor-pointer text-green-500">
                <i class="fa-solid fa-users text-xl w-6"></i>
                <span class="font-medium text-gray-800 dark:text-gray-200 text-sm">গ্রুপ (Groups)</span>
            </div>
            <div class="flex items-center space-x-3 p-3 rounded-xl hover:bg-gray-200 dark:hover:bg-fbDarkHover cursor-pointer text-red-500">
                <i class="fa-solid fa-clock-rotate-left text-xl w-6"></i>
                <span class="font-medium text-gray-800 dark:text-gray-200 text-sm">স্মৃতি (Memories)</span>
            </div>
            <hr class="my-2 border-gray-300 dark:border-gray-700">
            <button onclick="resetAppData()" class="w-full text-left flex items-center space-x-3 p-3 rounded-xl hover:bg-red-100 text-red-600 transition">
                <i class="fa-solid fa-trash-can text-xl w-6"></i>
                <span class="font-medium text-sm">অ্যাপ ডাটা রিসেট করুন</span>
            </button>
        </aside>

        <!-- ================= CENTER FEED ================= -->
        <main class="col-span-1 md:col-span-2 space-y-4">

            <!-- Stories Container -->
            <div class="flex space-x-2 overflow-x-auto custom-scrollbar pb-2">
                <!-- Add Story Card -->
                <div onclick="addStory()" class="relative min-w-[110px] h-40 rounded-xl bg-white dark:bg-fbDarkCard shadow cursor-pointer overflow-hidden group flex-shrink-0">
                    <img id="storyUserAvatar" src="https://i.pravatar.cc/150?img=68" class="h-28 w-full object-cover group-hover:scale-105 transition">
                    <div class="absolute bottom-0 inset-x-0 h-12 bg-white dark:bg-fbDarkCard flex flex-col items-center justify-end pb-1">
                        <div class="w-7 h-7 bg-fbBlue text-white rounded-full flex items-center justify-center -top-3 absolute border-2 border-white dark:border-fbDarkCard">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </div>
                        <span class="text-xs font-semibold">স্টোরি দিন</span>
                    </div>
                </div>
                <!-- Dynamic Stories Holder -->
                <div id="storiesList" class="flex space-x-2"></div>
            </div>

            <!-- Create Post Box -->
            <div class="bg-white dark:bg-fbDarkCard p-4 rounded-xl shadow space-y-3">
                <div class="flex items-center space-x-3">
                    <img id="createPostUserAvatar" src="https://i.pravatar.cc/150?img=68" class="w-10 h-10 rounded-full object-cover">
                    <input type="text" id="postInput" placeholder="আপনার মনে কি আছে?" 
                           class="w-full bg-fbBg dark:bg-fbDarkHover rounded-full px-4 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-fbBlue">
                </div>
                <!-- Image Preview Area -->
                <div id="imagePreviewContainer" class="hidden relative">
                    <img id="imagePreview" class="w-full max-h-60 object-cover rounded-lg border">
                    <button onclick="removeImagePreview()" class="absolute top-2 right-2 bg-gray-800 bg-opacity-70 text-white rounded-full w-7 h-7 flex items-center justify-center">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <hr class="border-gray-200 dark:border-gray-700">
                <div class="flex justify-between items-center text-gray-500 dark:text-gray-400 text-sm">
                    <label class="flex items-center space-x-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-fbDarkHover p-2 rounded-lg flex-1 justify-center">
                        <i class="fa-solid fa-images text-green-500 text-lg"></i>
                        <span class="font-medium text-xs sm:text-sm">ছবি/ভিডিও</span>
                        <input type="file" id="postImageInput" accept="image/*" class="hidden" onchange="previewSelectedImage(event)">
                    </label>
                    <button onclick="triggerEmoji()" class="flex items-center space-x-2 hover:bg-gray-100 dark:hover:bg-fbDarkHover p-2 rounded-lg flex-1 justify-center">
                        <i class="fa-solid fa-face-smile text-yellow-500 text-lg"></i>
                        <span class="font-medium text-xs sm:text-sm">অনুভূতি</span>
                    </button>
                    <button onclick="createNewPost()" class="bg-fbBlue text-white font-semibold px-5 py-1.5 rounded-lg hover:bg-blue-600 transition text-sm">
                        পোস্ট করুন
                    </button>
                </div>
            </div>

            <!-- Dynamic Feed Posts Holder -->
            <div id="feedPosts" class="space-y-4"></div>

        </main>

        <!-- ================= RIGHT SIDEBAR (Online Friends) ================= -->
        <aside class="hidden md:block col-span-1 space-y-4">
            <div class="bg-white dark:bg-fbDarkCard p-3 rounded-xl shadow">
                <h3 class="font-bold text-gray-500 dark:text-gray-400 text-sm mb-3">অনলাইন বন্ধুরা (Contacts)</h3>
                <div class="space-y-2">
                    <div onclick="toggleChatWindow('রহিম আহমেদ')" class="flex items-center space-x-3 p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-fbDarkHover cursor-pointer">
                        <div class="relative">
                            <img src="https://i.pravatar.cc/150?img=12" class="w-9 h-9 rounded-full">
                            <span class="w-3 h-3 bg-green-500 border-2 border-white dark:border-fbDarkCard rounded-full absolute bottom-0 right-0"></span>
                        </div>
                        <span class="font-medium text-sm">রহিম আহমেদ</span>
                    </div>
                    <div onclick="toggleChatWindow('সুমি আক্তার')" class="flex items-center space-x-3 p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-fbDarkHover cursor-pointer">
                        <div class="relative">
                            <img src="https://i.pravatar.cc/150?img=47" class="w-9 h-9 rounded-full">
                            <span class="w-3 h-3 bg-green-500 border-2 border-white dark:border-fbDarkCard rounded-full absolute bottom-0 right-0"></span>
                        </div>
                        <span class="font-medium text-sm">সুমি আক্তার</span>
                    </div>
                    <div onclick="toggleChatWindow('তানভীর ইসলাম')" class="flex items-center space-x-3 p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-fbDarkHover cursor-pointer">
                        <div class="relative">
                            <img src="https://i.pravatar.cc/150?img=33" class="w-9 h-9 rounded-full">
                            <span class="w-3 h-3 bg-green-500 border-2 border-white dark:border-fbDarkCard rounded-full absolute bottom-0 right-0"></span>
                        </div>
                        <span class="font-medium text-sm">তানভীর ইসলাম</span>
                    </div>
                </div>
            </div>
        </aside>

    </div>

    <!-- ================= FLOATING MESSENGER CHAT BOX ================= -->
    <div id="chatBox" class="fixed bottom-0 right-4 w-72 bg-white dark:bg-fbDarkCard rounded-t-xl shadow-2xl border border-gray-200 dark:border-gray-700 hidden z-50">
        <div class="bg-fbBlue text-white px-3 py-2 rounded-t-xl flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span id="chatFriendName" class="font-bold text-sm">রহিম আহমেদ</span>
            </div>
            <button onclick="closeChatWindow()" class="hover:text-gray-200"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="chatMessages" class="h-60 p-3 overflow-y-auto space-y-2 text-xs custom-scrollbar">
            <div class="bg-gray-100 dark:bg-fbDarkHover p-2 rounded-lg max-w-[80%] text-gray-800 dark:text-gray-200">
                হ্যালো! কেমন আছেন?
            </div>
        </div>
        <div class="p-2 border-t border-gray-200 dark:border-gray-700 flex items-center space-x-2">
            <input type="text" id="chatInput" placeholder="মেসেজ লিখুন..." onkeypress="handleChatKeyPress(event)"
                   class="w-full bg-fbBg dark:bg-fbDarkHover rounded-full px-3 py-1.5 text-xs focus:outline-none">
            <button onclick="sendChatMessage()" class="text-fbBlue p-1"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- ================= PROFILE EDIT MODAL ================= -->
    <div id="profileModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-fbDarkCard rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3 dark:border-gray-700">
                <h3 class="font-bold text-lg">প্রোফাইল এডিট করুন</h3>
                <button onclick="closeProfileModal()" class="text-gray-500 hover:text-black dark:hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold mb-1">আপনার নাম</label>
                    <input type="text" id="editUserName" class="w-full border dark:border-gray-700 dark:bg-fbDarkHover rounded-lg px-3 py-2 text-sm focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">প্রোফাইল পিকচার ইউআরএল (Image URL)</label>
                    <input type="text" id="editUserAvatar" class="w-full border dark:border-gray-700 dark:bg-fbDarkHover rounded-lg px-3 py-2 text-sm focus:outline-none">
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeProfileModal()" class="px-4 py-2 bg-gray-200 dark:bg-fbDarkHover rounded-lg text-sm font-semibold">বাতিল</button>
                <button onclick="saveUserProfile()" class="px-4 py-2 bg-fbBlue text-white rounded-lg text-sm font-semibold hover:bg-blue-600">সেভ করুন</button>
            </div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // Default State & LocalStorage Management
        let currentUser = JSON.parse(localStorage.getItem('socialhub_user')) || {
            name: 'সাকিব হাসান',
            avatar: 'https://i.pravatar.cc/150?img=68'
        };

        let posts = JSON.parse(localStorage.getItem('socialhub_posts')) || [
            {
                id: 1,
                author: 'তানভীর ইসলাম',
                avatar: 'https://i.pravatar.cc/150?img=33',
                time: '২ ঘণ্টা আগে',
                content: 'আজকের আবহাওয়া অসাধারণ! নতুন অ্যাপস প্রজেক্টের কাজ শেষ করলাম। 🚀🔥',
                image: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600',
                likes: 12,
                liked: false,
                comments: [
                    { author: 'সুমি আক্তার', text: 'অনেক শুভকামনা ভাইয়া!' }
                ]
            }
        ];

        let stories = JSON.parse(localStorage.getItem('socialhub_stories')) || [
            { id: 1, name: 'সুমি আক্তার', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300' },
            { id: 2, name: 'রহিম আহমেদ', img: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300' }
        ];

        let selectedPostImageBase64 = null;

        // Save State to LocalStorage
        function saveData() {
            localStorage.setItem('socialhub_user', JSON.stringify(currentUser));
            localStorage.setItem('socialhub_posts', JSON.stringify(posts));
            localStorage.setItem('socialhub_stories', JSON.stringify(stories));
        }

        // Initialize UI
        function initApp() {
            updateUserUI();
            renderStories();
            renderPosts();

            // Dark Mode check
            if (localStorage.getItem('socialhub_theme') === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').classList.replace('fa-moon', 'fa-sun');
            }
        }

        function updateUserUI() {
            document.getElementById('navUserAvatar').src = currentUser.avatar;
            document.getElementById('sidebarUserAvatar').src = currentUser.avatar;
            document.getElementById('createPostUserAvatar').src = currentUser.avatar;
            document.getElementById('storyUserAvatar').src = currentUser.avatar;
            document.getElementById('sidebarUserName').innerText = currentUser.name;
        }

        // Render Stories
        function renderStories() {
            const list = document.getElementById('storiesList');
            list.innerHTML = stories.map(s => `
                <div class="relative min-w-[110px] h-40 rounded-xl overflow-hidden cursor-pointer flex-shrink-0 group">
                    <img src="${s.img}" class="w-full h-full object-cover group-hover:scale-105 transition">
                    <div class="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-black/60"></div>
                    <span class="absolute bottom-2 left-2 text-white font-bold text-xs z-10">${s.name}</span>
                </div>
            `).join('');
        }

        function addStory() {
            const imgUrl = prompt('স্টোরির জন্য ছবির URL দিন:');
            if (imgUrl) {
                stories.unshift({ id: Date.now(), name: currentUser.name, img: imgUrl });
                saveData();
                renderStories();
            }
        }

        // Handle Image Upload Preview
        function previewSelectedImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedPostImageBase64 = e.target.result;
                    document.getElementById('imagePreview').src = selectedPostImageBase64;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function removeImagePreview() {
            selectedPostImageBase64 = null;
            document.getElementById('postImageInput').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        // Create New Post
        function createNewPost() {
            const input = document.getElementById('postInput');
            const content = input.value.trim();

            if (!content && !selectedPostImageBase64) {
                alert('পোস্টে লিখুন বা একটি ছবি যুক্ত করুন!');
                return;
            }

            const newPost = {
                id: Date.now(),
                author: currentUser.name,
                avatar: currentUser.avatar,
                time: 'এখনই',
                content: content,
                image: selectedPostImageBase64,
                likes: 0,
                liked: false,
                comments: []
            };

            posts.unshift(newPost);
            saveData();
            renderPosts();

            // Reset Form
            input.value = '';
            removeImagePreview();
        }

        // Render All Posts
        function renderPosts(filteredPosts = null) {
            const container = document.getElementById('feedPosts');
            const targetPosts = filteredPosts || posts;

            if (targetPosts.length === 0) {
                container.innerHTML = `<div class="bg-white dark:bg-fbDarkCard p-6 rounded-xl text-center text-gray-500">কোনো পোস্ট পাওয়া যায়নি।</div>`;
                return;
            }

            container.innerHTML = targetPosts.map(post => `
                <div class="bg-white dark:bg-fbDarkCard rounded-xl shadow p-4 space-y-3">
                    <!-- Post Header -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <img src="${post.avatar}" class="w-10 h-10 rounded-full object-cover">
                            <div>
                                <h4 class="font-bold text-sm">${post.author}</h4>
                                <span class="text-xs text-gray-500 dark:text-gray-400">${post.time} · <i class="fa-solid fa-earth-americas"></i></span>
                            </div>
                        </div>
                        ${post.author === currentUser.name ? `
                            <button onclick="deletePost(${post.id})" class="text-gray-400 hover:text-red-500 p-2">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        ` : ''}
                    </div>

                    <!-- Post Content -->
                    ${post.content ? `<p class="text-sm leading-relaxed">${escapeHtml(post.content)}</p>` : ''}

                    <!-- Post Image -->
                    ${post.image ? `<img src="${post.image}" class="w-full rounded-lg max-h-96 object-cover">` : ''}

                    <!-- Post Stats -->
                    <div class="flex justify-between items-center text-xs text-gray-500 dark:text-gray-400 pt-1">
                        <div class="flex items-center space-x-1">
                            <span class="bg-fbBlue text-white p-1 rounded-full w-4 h-4 flex items-center justify-center text-[10px]">
                                <i class="fa-solid fa-thumbs-up"></i>
                            </span>
                            <span>${post.likes}</span>
                        </div>
                        <div>
                            <span>${post.comments.length} কমেন্ট</span>
                        </div>
                    </div>

                    <hr class="border-gray-200 dark:border-gray-700">

                    <!-- Like / Comment / Share Buttons -->
                    <div class="flex justify-around items-center text-gray-500 dark:text-gray-400 text-sm font-semibold">
                        <button onclick="toggleLike(${post.id})" class="flex items-center space-x-2 p-2 hover:bg-gray-100 dark:hover:bg-fbDarkHover rounded-lg flex-1 justify-center transition ${post.liked ? 'text-fbBlue' : ''}">
                            <i class="fa-solid fa-thumbs-up"></i>
                            <span>লাইক</span>
                        </button>
                        <button onclick="focusCommentInput(${post.id})" class="flex items-center space-x-2 p-2 hover:bg-gray-100 dark:hover:bg-fbDarkHover rounded-lg flex-1 justify-center transition">
                            <i class="fa-solid fa-comment"></i>
                            <span>কমেন্ট</span>
                        </button>
                        <button onclick="sharePost()" class="flex items-center space-x-2 p-2 hover:bg-gray-100 dark:hover:bg-fbDarkHover rounded-lg flex-1 justify-center transition">
                            <i class="fa-solid fa-share"></i>
                            <span>শেয়ার</span>
                        </button>
                    </div>

                    <!-- Comments Section -->
                    <div class="space-y-2 pt-2 border-t border-gray-100 dark:border-gray-800">
                        ${post.comments.map(c => `
                            <div class="flex items-start space-x-2 text-xs">
                                <img src="https://i.pravatar.cc/150?u=${c.author}" class="w-7 h-7 rounded-full">
                                <div class="bg-fbBg dark:bg-fbDarkHover p-2 rounded-xl max-w-[85%]">
                                    <span class="font-bold block">${c.author}</span>
                                    <span>${escapeHtml(c.text)}</span>
                                </div>
                            </div>
                        `).join('')}

                        <!-- Add Comment Input -->
                        <div class="flex items-center space-x-2 pt-2">
                            <img src="${currentUser.avatar}" class="w-7 h-7 rounded-full">
                            <input type="text" id="comment-input-${post.id}" placeholder="একটি কমেন্ট লিখুন..." 
                                   onkeypress="handleCommentKeyPress(event, ${post.id})"
                                   class="w-full bg-fbBg dark:bg-fbDarkHover rounded-full px-3 py-1 text-xs focus:outline-none">
                            <button onclick="addComment(${post.id})" class="text-fbBlue p-1 text-sm"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>

                </div>
            `).join('');
        }

        // Post Actions
        function toggleLike(postId) {
            const post = posts.find(p => p.id === postId);
            if (post) {
                post.liked = !post.liked;
                post.likes += post.liked ? 1 : -1;
                saveData();
                renderPosts();
            }
        }

        function addComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (text) {
                const post = posts.find(p => p.id === postId);
                post.comments.push({ author: currentUser.name, text: text });
                saveData();
                renderPosts();
            }
        }

        function handleCommentKeyPress(e, postId) {
            if (e.key === 'Enter') addComment(postId);
        }

        function deletePost(postId) {
            if (confirm('আপনি কি এই পোস্টটি মুছে ফেলতে চান?')) {
                posts = posts.filter(p => p.id !== postId);
                saveData();
                renderPosts();
            }
        }

        function sharePost() {
            alert('পোস্টের লিংক কপি করা হয়েছে!');
        }

        function filterPosts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = posts.filter(p => p.content.toLowerCase().includes(query) || p.author.toLowerCase().includes(query));
            renderPosts(filtered);
        }

        // Profile Modal Logic
        function openProfileModal() {
            document.getElementById('editUserName').value = currentUser.name;
            document.getElementById('editUserAvatar').value = currentUser.avatar;
            document.getElementById('profileModal').classList.remove('hidden');
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.add('hidden');
        }

        function saveUserProfile() {
            const name = document.getElementById('editUserName').value.trim();
            const avatar = document.getElementById('editUserAvatar').value.trim();
            if (name) currentUser.name = name;
            if (avatar) currentUser.avatar = avatar;
            saveData();
            updateUserUI();
            closeProfileModal();
        }

        // Dark Mode Logic
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('socialhub_theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').classList.toggle('fa-sun', isDark);
            document.getElementById('themeIcon').classList.toggle('fa-moon', !isDark);
        }

        // Live Chat Messenger Window
        let activeChatFriend = 'রহিম আহমেদ';
        function toggleChatWindow(friendName) {
            activeChatFriend = friendName;
            document.getElementById('chatFriendName').innerText = friendName;
            document.getElementById('chatBox').classList.remove('hidden');
        }

        function closeChatWindow() {
            document.getElementById('chatBox').classList.add('hidden');
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (msg) {
                const chatArea = document.getElementById('chatMessages');
                chatArea.innerHTML += `
                    <div class="bg-fbBlue text-white p-2 rounded-lg max-w-[80%] ml-auto text-right">
                        ${escapeHtml(msg)}
                    </div>
                `;
                input.value = '';
                chatArea.scrollTop = chatArea.scrollHeight;
            }
        }

        function handleChatKeyPress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        // Reset App Data
        function resetAppData() {
            if (confirm('আপনি কি অ্যাপের সমস্ত ডাটা মুছে প্রথম অবস্থায় ফিরিয়ে নিতে চান?')) {
                localStorage.clear();
                location.reload();
            }
        }

        function triggerEmoji() {
            const emojis = ['😊', '❤️', '🔥', '👍', '😍', '🎉'];
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            document.getElementById('postInput').value += ' ' + randomEmoji;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // App Launch
        initApp();
    </script>
</body>
</html>
